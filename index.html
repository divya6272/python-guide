<style>
:root{
  --ink:#0f172a; --muted:#64748b; --line:#e5e7eb; --soft:#f8fafc; --brand:#2563eb;
  --radius:14px; --c:#2563eb; --t:#1d4ed8; --s:#eff6ff;
}
*{box-sizing:border-box}
html{color-scheme:light;-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:#fff;color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--brand)}
:focus-visible{outline:3px solid #93c5fd;outline-offset:2px;border-radius:8px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}

/* ---------- header ---------- */
.bar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.88);-webkit-backdrop-filter:saturate(180%) blur(12px);backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line)}
.bar-in{display:flex;align-items:center;gap:14px;padding-top:10px;padding-bottom:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left}
.logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px;background:linear-gradient(135deg,#2563eb,#7c3aed);box-shadow:0 6px 16px -6px rgba(37,99,235,.6)}
.brand b{font-size:17px;letter-spacing:-.01em;display:block;line-height:1.15}
.brand small{display:block;color:var(--muted);font-size:12px;line-height:1.1}
.tabs{display:flex;gap:4px;background:var(--soft);border:1px solid var(--line);padding:4px;border-radius:12px;margin:0 auto}
.tab{border:0;background:transparent;padding:8px 16px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted);transition:background .2s,color .2s,box-shadow .2s;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:#fff;color:var(--brand);box-shadow:0 1px 3px rgba(15,23,42,.12)}
.chip-prog{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:#166534;background:#f0fdf4;white-space:nowrap}
.chip-prog i{display:block;width:44px;height:6px;border-radius:99px;background:#dcfce7;overflow:hidden}
.chip-prog i b{display:block;height:100%;width:0;background:#16a34a;border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.2,1)}

/* ---------- hero ---------- */
.hero{position:relative;padding:44px 0 8px;isolation:isolate}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.32;z-index:-1;animation:float 16s ease-in-out infinite}
.b1{width:300px;height:300px;background:#93c5fd;left:-40px;top:0}
.b2{width:280px;height:280px;background:#f9a8d4;right:-20px;top:10px;animation-delay:-6s}
.b3{width:220px;height:220px;background:#fde68a;left:46%;top:90px;animation-delay:-11s;opacity:.25}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(26px,18px) scale(1.06)}66%{transform:translate(-18px,28px) scale(.96)}}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#4338ca;background:#eef2ff;border:1px solid #e0e7ff;border-radius:999px;padding:5px 12px}
.eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:#6366f1;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(99,102,241,.5)}70%{box-shadow:0 0 0 8px rgba(99,102,241,0)}100%{box-shadow:0 0 0 0 rgba(99,102,241,0)}}
.hero h1{font-size:clamp(2rem,6vw,3.4rem);line-height:1.08;letter-spacing:-.03em;margin:16px 0 12px;font-weight:800}
.grad{font-style:normal;background:linear-gradient(90deg,#2563eb,#7c3aed,#db2777,#2563eb);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 7s linear infinite}
@keyframes shine{to{background-position:250% 0}}
.hero p{color:var(--muted);max-width:56ch;margin:0 0 22px;font-size:clamp(1rem,2.4vw,1.1rem)}
.stats{display:flex;flex-wrap:wrap;gap:12px}
.stat{background:rgba(255,255,255,.8);border:1px solid var(--line);border-radius:14px;padding:12px 18px;min-width:108px}
.stat b{display:block;font-size:26px;line-height:1.1;letter-spacing:-.02em}
.stat span{font-size:12.5px;color:var(--muted)}

/* ---------- toolbar ---------- */
.toolbar{padding-top:18px}
.search{position:relative}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search input{width:100%;height:48px;border:1px solid var(--line);border-radius:12px;padding:0 44px 0 42px;font:inherit;background:#fff;color:var(--ink);transition:border-color .2s,box-shadow .2s}
.search input::placeholder{color:#94a3b8}
.search input:focus{outline:0;border-color:#93c5fd;box-shadow:0 0 0 4px rgba(147,197,253,.35)}
.search kbd{position:absolute;right:12px;top:50%;transform:translateY(-50%);font:12px ui-monospace,Consolas,monospace;color:var(--muted);border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:1px 7px;background:var(--soft)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 0 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:13.5px;font-weight:600;color:var(--muted);white-space:nowrap;transition:all .2s;min-height:36px}
.chip:hover{border-color:#cbd5e1;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.chip em{font-style:normal;opacity:.6;margin-left:5px;font-weight:500}

/* ---------- topic cards ---------- */
.view{animation:fadeUp .4s cubic-bezier(.2,.8,.2,1) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.sec-h{display:flex;align-items:center;gap:10px;margin:30px 0 12px}
.sec-h i{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 0 4px var(--s)}
.sec-h h2{margin:0;font-size:13px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--t)}
.sec-h span{font-size:12.5px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{position:relative;display:flex;flex-direction:column;gap:6px;text-align:left;min-width:0;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px 16px 14px;overflow:hidden;transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s,border-color .25s}
.card::before{content:"";position:absolute;left:0;top:0;height:3px;width:100%;background:var(--c);transform:scaleX(0);transform-origin:left;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.card:hover{transform:translateY(-4px);border-color:var(--c);box-shadow:0 16px 32px -16px rgba(15,23,42,.28)}
.card:hover::before{transform:scaleX(1)}
.card:active{transform:scale(.98)}
.tag{align-self:flex-start;background:var(--s);color:var(--t);font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;border-radius:999px;padding:3px 9px}
.card h3{margin:2px 0 0;font-size:15.5px;line-height:1.3;overflow-wrap:anywhere}
.card p{margin:0;font-size:12.5px;line-height:1.45;color:var(--muted)}
.card .go{margin-top:auto;padding-top:8px;font-size:12.5px;font-weight:700;color:var(--t);display:flex;align-items:center;gap:4px}
.card .go svg{transition:transform .25s}
.card:hover .go svg{transform:translateX(4px)}
.tick{position:absolute;right:12px;top:12px;width:22px;height:22px;border-radius:50%;background:#16a34a;color:#fff;display:none;place-items:center}
.card.done .tick{display:grid;animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.rv{opacity:0;transform:translateY(16px);transition:opacity .5s ease,transform .5s cubic-bezier(.2,.8,.2,1);transition-delay:var(--d,0ms)}
.rv.in{opacity:1;transform:none}
.card.rv.in{transition:opacity .5s ease var(--d,0ms),transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s,border-color .25s}
.empty{text-align:center;color:var(--muted);padding:56px 12px}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:4px}

/* ---------- lesson ---------- */
.back{display:inline-flex;align-items:center;gap:8px;background:none;border:0;padding:8px 10px 8px 0;margin-top:18px;color:var(--muted);font-weight:600;font-size:14px;min-height:44px}
.back svg{transition:transform .25s}
.back:hover{color:var(--ink)}
.back:hover svg{transform:translateX(-4px)}
.lesson-h{display:flex;flex-direction:column;gap:8px;margin:2px 0 18px}
.lesson-h h1{margin:0;font-size:clamp(1.6rem,5vw,2.4rem);line-height:1.15;letter-spacing:-.02em;overflow-wrap:anywhere}
.pills{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.pills::-webkit-scrollbar{display:none}
.pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;font-size:13.5px;font-weight:600;color:var(--muted);white-space:nowrap;min-height:40px;transition:all .2s}
.pill:hover{border-color:var(--c);color:var(--t)}
.pill[aria-selected="true"]{background:var(--c);border-color:var(--c);color:#fff;box-shadow:0 8px 18px -8px var(--c)}
.panel{animation:fadeUp .35s cubic-bezier(.2,.8,.2,1) both;margin-top:12px}
.why{border-left:4px solid var(--c);background:var(--s);padding:14px 18px;border-radius:0 12px 12px 0;color:#334155;font-size:15.5px}
.code{margin-top:14px;border:1px solid var(--line);border-radius:12px;background:var(--soft);overflow:hidden}
.code-h{display:flex;justify-content:space-between;align-items:center;padding:6px 8px 6px 14px;background:#f1f5f9;border-bottom:1px solid var(--line);font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.copy{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 10px;font-size:12px;font-weight:600;text-transform:none;letter-spacing:0;color:var(--ink);min-height:32px;transition:all .2s}
.copy:hover{border-color:#cbd5e1;background:var(--soft)}
.copy.ok{color:#166534;border-color:#86efac;background:#f0fdf4}
.code pre{margin:0;padding:14px 16px;overflow-x:auto;-webkit-overflow-scrolling:touch;font:13.5px/1.8 ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;color:#0f172a;tab-size:4}
.code code{font:inherit}
.tk-c{color:#94a3b8;font-style:italic}.tk-s{color:#15803d}.tk-k{color:#7c3aed;font-weight:600}.tk-n{color:#c2410c}
.tk-b{color:#1d4ed8}.tk-d{color:#be185d}.tk-f{color:#0e7490;font-weight:600}.tk-self{color:#b45309;font-style:italic}
.lnav{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:stretch;margin-top:34px}
.nbtn{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 16px;text-align:left;min-width:0;transition:all .25s}
.nbtn small{color:var(--muted);font-size:12px}
.nbtn b{font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nbtn:hover{border-color:var(--brand);transform:translateY(-2px);box-shadow:0 10px 22px -14px rgba(15,23,42,.35)}
.nbtn.next{text-align:right}
.nbtn[disabled]{visibility:hidden}
.donebtn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:0 18px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;transition:all .25s;min-height:52px}
.donebtn:hover{border-color:#86efac;background:#f0fdf4}
.donebtn.on{background:#16a34a;border-color:#16a34a;color:#fff}

/* ---------- accordion ---------- */
.acc{border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:10px;transition:border-color .25s,box-shadow .25s}
.acc:hover{border-color:#cbd5e1}
.acc.open{border-color:#bfdbfe;box-shadow:0 10px 24px -18px rgba(37,99,235,.5)}
.acc-h{width:100%;display:flex;align-items:center;gap:12px;border:0;background:transparent;text-align:left;padding:14px 16px;font-weight:700;font-size:15.5px;min-height:56px;border-radius:12px}
.qn{flex:none;min-width:34px;height:26px;display:grid;place-items:center;border-radius:8px;background:#eff6ff;color:#1d4ed8;font-size:12px;font-weight:800}
.acc-h .t{flex:1;min-width:0;overflow-wrap:anywhere}
.pm{flex:none;width:22px;height:22px;position:relative;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.pm::before,.pm::after{content:"";position:absolute;left:50%;top:50%;width:12px;height:2px;margin:-1px 0 0 -6px;background:var(--muted);border-radius:2px}
.pm::after{transform:rotate(90deg)}
.acc.open .pm{transform:rotate(135deg)}
.acc-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s cubic-bezier(.2,.8,.2,1)}
.acc.open .acc-b{grid-template-rows:1fr}
.acc-b>div{overflow:hidden;min-height:0}
.acc-c{padding:2px 16px 16px 62px;color:#334155}
.acc-c code{font:13px ui-monospace,Menlo,Consolas,monospace;background:#f1f5f9;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:#0f172a}
.gcode{padding:0 16px 16px}
.gcode .code{margin-top:0}
.pg-h{margin:22px 0 14px}
.pg-h h1{margin:0 0 4px;font-size:clamp(1.5rem,4.5vw,2rem);letter-spacing:-.02em}
.pg-h p{margin:0;color:var(--muted)}

/* ---------- footer ---------- */
.foot{border-top:1px solid var(--line);margin-top:56px;padding:24px 0 40px;color:var(--muted);font-size:14px;display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:space-between}
.foot a{color:var(--ink);font-weight:600;text-decoration:none}
.foot a:hover{text-decoration:underline}

/* ---------- responsive ---------- */
@media (max-width:760px){
  .bar-in{gap:10px}
  .tabs{order:3;width:100%;margin:0}
  .tab{flex:1;padding:10px 8px;font-size:13.5px}
  .brand small{display:none}
  .chip-prog{margin-left:auto}
  .hero{padding-top:30px}
  .search kbd{display:none}
}
@media (max-width:520px){
  .wrap{padding:0 16px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .card{padding:13px 12px 12px}
  .card h3{font-size:14.5px}
  .card p{font-size:12px}
  .stat{flex:1;min-width:0;padding:10px 12px}
  .stat b{font-size:22px}
  .acc-c{padding:2px 16px 16px 16px}
  .lnav{grid-template-columns:1fr 1fr}
  .donebtn{grid-column:1 / -1;order:-1;justify-content:center}
  .code pre{font-size:12.5px;padding:12px}
  .why{font-size:15px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  .rv{opacity:1;transform:none}
}
noscript{display:block;padding:40px 20px;text-align:center}
</style>

<script>
(function(){
'use strict';

const topics = {
  basics:[
    {id:'variables',badge:'b1',title:'Variables & Types',tabs:['basics','type checking','casting'],
     why:['Store data. Python is dynamically typed — no need to declare type.','Check what type a variable is at runtime.','Convert between types explicitly.'],
     code:[
`name = "Divya"     # str
age  = 21          # int
gpa  = 9.2         # float
is_student = True  # bool
nothing = None     # NoneType`,
`type("hello")   # <class 'str'>
type(21)        # <class 'int'>
isinstance(21, int)   # True
isinstance("hi", str) # True`,
`int("42")      # 42
float("3.14")  # 3.14
str(99)        # "99"
bool(0)        # False
bool(1)        # True
list((1,2,3))  # [1,2,3]`]},

    {id:'strings',badge:'b1',title:'Strings',tabs:['basics','methods','formatting','slicing'],
     why:['Strings are immutable sequences of characters. Most common data type in interviews.','Built-in methods save you from writing loops.','f-strings are the modern way to build strings.','Slicing lets you extract parts of a string without a loop.'],
     code:[
`s = "hello world"
len(s)          # 11
s[0]            # 'h'
s[-1]           # 'd'
"lo" in s       # True`,
`s.upper()       # 'HELLO WORLD'
s.lower()       # 'hello world'
s.strip()       # removes whitespace
s.replace("world","Python")
s.split(" ")    # ['hello','world']
s.startswith("he")  # True
s.count("l")    # 3
s.find("o")     # 4`,
`name = "Divya"
age  = 21
f"My name is {name}, age {age}"
# 'My name is Divya, age 21'
f"{3.14159:.2f}"   # '3.14'`,
`s = "hello"
s[1:3]    # 'el'
s[::-1]   # 'olleh' — reverse
s[::2]    # 'hlo'  — every 2nd char`]},

    {id:'lists',badge:'b1',title:'Lists',tabs:['basics','methods','comprehension'],
     why:['Most used data structure. Ordered, mutable, allows duplicates.','Built-in methods cover 90% of what you need.','Comprehension = shorter and faster than a for loop.'],
     code:[
`a = [1,2,3,4,2]
a[0]        # 1
a[-1]       # 2
len(a)      # 5
2 in a      # True`,
`a.append(5)      # add to end
a.insert(0,99)   # add at index
a.remove(2)      # remove first 2
a.pop()          # remove & return last
a.sort()         # sort in place
sorted(a)        # returns new sorted list
a.reverse()
a.count(2)       # count occurrences
a.index(3)       # find index`,
`[x*x for x in range(5)]
# [0,1,4,9,16]

[x for x in range(10) if x%2==0]
# [0,2,4,6,8]

["E" if x%2==0 else "O" for x in range(4)]
# ['E','O','E','O']`]},

    {id:'tuples',badge:'b1',title:'Tuples',tabs:['basics','use cases'],
     why:['Immutable list. Faster, uses less memory. Hashable — can be dict key.','Use tuples for fixed data, coordinates, dict keys, function return values.'],
     code:[
`t = (1,2,3)
t[0]          # 1
x,y,z = t     # unpack
a,*rest = t   # a=1, rest=[2,3]
single = (42,)  # trailing comma needed!
(42)            # just int — NOT a tuple`,
`# 1. dict key
d = {(0,0):"origin", (1,2):"point A"}

# 2. return multiple values
def minmax(lst): return min(lst),max(lst)
lo,hi = minmax([3,1,4,1,5])

# 3. named tuple
from collections import namedtuple
Point = namedtuple("Point",["x","y"])
p = Point(3,4)
p.x  # 3`]},

    {id:'sets',badge:'b1',title:'Sets',tabs:['basics','set math'],
     why:['Unordered, unique items, O(1) lookup. Use to remove duplicates or check membership fast.','Set math solves many interview problems in one line.'],
     code:[
`s = {1,2,2,3}   # {1,2,3} auto dedup
s.add(4)
s.remove(2)      # KeyError if missing
s.discard(99)    # safe

const qs=[
  {q:"list vs tuple — difference?",a:"List = mutable, tuple = immutable + hashable. Tuple can be a dict key, list cannot. Tuple is faster."},
  {q:"What is the GIL?",a:"Global Interpreter Lock. Only one thread runs Python at a time. Use <code>multiprocessing</code> for CPU tasks. <code>threading</code> only for I/O."},
  {q:"*args vs **kwargs?",a:"<code>*args</code> = extra positionals → arrives as tuple. <code>**kwargs</code> = extra keywords → arrives as dict."},
  {q:"__str__ vs __repr__?",a:"<code>__str__</code> for users → called by print(). <code>__repr__</code> for devs → called in REPL. Always define __repr__ at minimum."},
  {q:"@classmethod vs @staticmethod?",a:"<code>@classmethod</code> gets cls → class state or alt constructor. <code>@staticmethod</code> gets nothing → utility function."},
  {q:"What does @wraps do?",a:"Preserves __name__ and __doc__ after decorating. Without it function is renamed 'wrapper'."},
  {q:"What is a generator?",a:"Uses <code>yield</code>. One value at a time. Memory efficient — nothing stored upfront."},
  {q:"Encapsulation vs Abstraction?",a:"Encapsulation = hide data (__). Abstraction = hide implementation (ABC). Car: hidden engine = encapsulation. Steering wheel only = abstraction."},
  {q:"What is LEGB?",a:"Name lookup order: Local → Enclosing → Global → Built-in. Stops at first match."},
  {q:"What is a closure?",a:"Inner function remembers outer variables even after outer function has returned."},
  {q:"What does @property do?",a:"Turns a method into an attribute-style getter/setter. Adds validation without changing how you access it."},
  {q:"Shallow vs deep copy?",a:"Shallow = outer copied, inner still shared. Deep = fully independent copy of everything."},
  {q:"Counter vs defaultdict?",a:"<code>Counter</code> counts occurrences. <code>defaultdict</code> returns a default value instead of raising KeyError."},
  {q:"What is nonlocal?",a:"Lets inner function write to a variable in the enclosing (outer) function scope."},
  {q:"is vs ==?",a:"<code>==</code> checks value. <code>is</code> checks same object in memory (same id). Always use == for value comparison."},
  {q:"Why is dict O(1) lookup?",a:"Uses a hash table internally. Hash of key maps directly to memory location — no scanning needed."},
  {q:"mutable vs immutable?",a:"Immutable: int, str, tuple, float — cannot change in place, new object created. Mutable: list, dict, set — change in place."},
  {q:"What is a context manager?",a:"<code>with</code> statement. Calls __enter__ on open, __exit__ on close even if error occurs. Used for files, locks, timers."},
];

  advanced:{label:'Advanced',c:'#db2777',t:'#be185d',s:'#fdf2f8'},
  ds:{label:'DS / ML',c:'#7c3aed',t:'#6d28d9',s:'#f5f3ff'},
  must:{label:'Must know',c:'#ea580c',t:'#c2410c',s:'#fff7ed'}
};
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const stripTags=s=>String(s).replace(/<[^>]*>/g,'');
const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const app=$('#app');

const all=[];
Object.keys(SEC).forEach(sec=>{(topics[sec]||[]).forEach(t=>all.push(Object.assign({sec:sec},t)))});
const byId={};all.forEach((t,i)=>{t.i=i;byId[t.id]=t});
const totalCode=all.reduce((n,t)=>n+t.code.length,0);

/* progress (saved in the browser; safe if storage is blocked) */
let done=new Set();
try{done=new Set(JSON.parse(localStorage.getItem('pyguide.done')||'[]').filter(id=>byId[id]))}catch(e){}
function saveDone(){try{localStorage.setItem('pyguide.done',JSON.stringify(Array.from(done)))}catch(e){}}
function updateProg(){
  $('#progTxt').textContent=done.size+'/'+all.length;
  $('#progBar').style.width=(all.length?done.size/all.length*100:0)+'%';
}

/* ------------------------------------------------------------ code highlight (light theme) */
const KW=new Set('and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield'.split(' '));
const CONSTS=new Set(['None','True','False']);
const BI=new Set('print len range int str float bool list dict set tuple type isinstance sorted sum min max any all map filter zip enumerate abs open super iter next id repr input ord chr round reversed hash'.split(' '));
const TOK=/(#[^\n]*)|([rRbBfF]{0,2}(?:"""[\s\S]*?"""|'''[\s\S]*?'''|"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*'))|(@[A-Za-z_][\w.]*)|(\b\d[\d_]*(?:\.\d+)?\b)|([A-Za-z_]\w*)/g;
function hl(code){
  let out='',last=0,m,prev='';
  TOK.lastIndex=0;
  while((m=TOK.exec(code))){
    out+=esc(code.slice(last,m.index));last=TOK.lastIndex;
    const tok=m[0];
    if(m[1]){out+='<span class="tk-c">'+esc(tok)+'</span>';prev=''}
    else if(m[2]){out+='<span class="tk-s">'+esc(tok)+'</span>';prev=''}
    else if(m[3]){out+='<span class="tk-d">'+esc(tok)+'</span>';prev=''}
    else if(m[4]){out+='<span class="tk-n">'+esc(tok)+'</span>';prev=''}
    else{
      let cls='';
      if(prev==='def'||prev==='class')cls='tk-f';
      else if(KW.has(tok))cls='tk-k';
      else if(CONSTS.has(tok))cls='tk-n';
      else if(tok==='self'||tok==='cls')cls='tk-self';
      else if(BI.has(tok))cls='tk-b';
      out+=cls?'<span class="'+cls+'">'+esc(tok)+'</span>':esc(tok);
      prev=tok;
    }
  }
  return out+esc(code.slice(last));
}
const codeStore=[];
const ICON_COPY='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';
function codeBlock(code,label){
  const i=codeStore.push(code)-1;
  return '<div class="code"><div class="code-h"><span>'+(label||'python')+'</span><button class="copy" type="button" data-copy="'+i+'" aria-label="Copy code">'+ICON_COPY+'<span>Copy</span></button></div><pre><code>'+hl(code)+'</code></pre></div>';
}
function copyText(txt,btn){
  const label=btn.querySelector('span');
  const ok=()=>{btn.classList.add('ok');label.textContent='Copied';setTimeout(()=>{btn.classList.remove('ok');label.textContent='Copy'},1600)};
  const fallback=()=>{const ta=document.createElement('textarea');ta.value=txt;ta.style.cssText='position:fixed;opacity:0;top:0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');ok()}catch(e){}ta.remove()};
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(txt).then(ok,fallback)}else{fallback()}
}

/* ------------------------------------------------------------ reveal on scroll */
let io=null;
function reveal(root,instant){
  const els=$$('.rv:not(.in)',root);
  if(instant||reduce||!('IntersectionObserver' in window)){els.forEach(e=>e.classList.add('in'));return}
  if(!io){io=new IntersectionObserver(en=>{en.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target)}})},{threshold:.06,rootMargin:'0px 0px -24px 0px'})}
  els.forEach(e=>io.observe(e));
  setTimeout(()=>els.forEach(e=>e.classList.add('in')),1800);
}
function countUp(el){
  const to=+el.dataset.n;
  if(reduce){el.textContent=to;return}
  const t0=performance.now(),dur=900;
  (function step(t){const p=Math.min(1,(t-t0)/dur);el.textContent=Math.round(to*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(step)})(t0);
}

/* ------------------------------------------------------------ state */
let query='',chip='all',savedY=0,cameFromLesson=false,lessonTab=0;

/* ------------------------------------------------------------ views */
function setTab(name){
  $$('.tab').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===name)));
  $('#toolbar').style.display=name==='lesson'?'none':'';
  $('#q').placeholder=name==='qa'?'Search interview questions...':name==='gotchas'?'Search gotchas...':'Search topics, questions, code...';
}
function mount(html,tab){
  setTab(tab);
  app.innerHTML='<div class="view">'+html+'</div>';
}

/* topics */
function topicMatch(t){
  if(!query)return true;
  const hay=(t.title+' '+t.tabs.join(' ')+' '+t.why.join(' ')+' '+t.code.join(' ')+' '+SEC[t.sec].label).toLowerCase();
  return query.toLowerCase().split(/\s+/).every(w=>hay.indexOf(w)>-1);
}
function renderTopics(){
  const hero=
    '<section class="hero"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i>'+
    '<span class="eyebrow">Interview-ready notes</span>'+
    '<h1>Python, the <em class="grad">interview</em> way.</h1>'+
    '<p>Short explanations, real code you can copy, and the gotchas interviewers love to ask about. Works on phone and laptop.</p>'+
    '<div class="stats">'+
      '<div class="stat"><b data-n="'+all.length+'">0</b><span>topics</span></div>'+
      '<div class="stat"><b data-n="'+totalCode+'">0</b><span>code examples</span></div>'+
      '<div class="stat"><b data-n="'+qs.length+'">0</b><span>interview Q&amp;A</span></div>'+
      '<div class="stat"><b data-n="'+gotchas.length+'">0</b><span>gotchas</span></div>'+
    '</div></section>';
  const chips='<div class="chips" role="group" aria-label="Filter by category"><button class="chip" data-chip="all" aria-pressed="'+(chip==='all')+'">All<em>'+all.length+'</em></button>'+
    Object.keys(SEC).map(k=>'<button class="chip" data-chip="'+k+'" aria-pressed="'+(chip===k)+'">'+SEC[k].label+'<em>'+(topics[k]||[]).length+'</em></button>').join('')+'</div>';
  mount(hero+chips+'<div id="list"></div>','topics');
  fillTopics(false);
  $$('.stat b').forEach(countUp);
  if(cameFromLesson){window.scrollTo(0,savedY);cameFromLesson=false}else{window.scrollTo(0,0)}
}
function fillTopics(instant){
  let html='',n=0,shown=0;
  Object.keys(SEC).forEach(sec=>{
    if(chip!=='all'&&chip!==sec)return;
    const items=all.filter(t=>t.sec===sec&&topicMatch(t));
    if(!items.length)return;
    shown+=items.length;
    const S=SEC[sec];
    html+='<div class="sec-h" style="--c:'+S.c+';--t:'+S.t+';--s:'+S.s+'"><i></i><h2>'+S.label+'</h2><span>'+items.length+' topic'+(items.length>1?'s':'')+'</span></div><div class="grid">';
    items.forEach(t=>{
      html+='<button class="card rv'+(done.has(t.id)?' done':'')+'" data-go="#/topic/'+t.id+'" style="--c:'+S.c+';--t:'+S.t+';--s:'+S.s+';--d:'+Math.min(n*45,360)+'ms" aria-label="Open '+esc(t.title)+'">'+
        '<span class="tick" aria-hidden="true"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg></span>'+
        '<span class="tag">'+S.label+'</span><h3>'+esc(t.title)+'</h3><p>'+esc(t.tabs.slice(0,3).join(' · '))+'</p>'+
        '<span class="go">Open <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></span></button>';
      n++;
    });
    html+='</div>';
  });
  if(!shown)html='<div class="empty"><b>No topics found</b>Try a different word, like "list" or "decorator".</div>';
  const list=$('#list');if(!list)return;
  list.innerHTML=html;
  reveal(list,instant);
}

/* lesson */
function renderLesson(id){
  const t=byId[id];
  const S=SEC[t.sec];
  const prev=all[t.i-1],next=all[t.i+1];
  lessonTab=0;
  const pills=t.tabs.map((x,i)=>'<button class="pill" role="tab" data-pill="'+i+'" aria-selected="'+(i===0)+'">'+esc(x)+'</button>').join('');
  const html=
    '<div style="--c:'+S.c+';--t:'+S.t+';--s:'+S.s+'">'+
    '<button class="back" data-back><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5m6-6-6 6 6 6"/></svg>All topics</button>'+
    '<div class="lesson-h"><span class="tag">'+S.label+'</span><h1>'+esc(t.title)+'</h1></div>'+
    '<div class="pills" role="tablist" aria-label="Lesson parts">'+pills+'</div>'+
    '<div id="panel"></div>'+
    '<div class="lnav">'+
      '<button class="nbtn prev" '+(prev?'data-go="#/topic/'+prev.id+'"':'disabled')+'><small>← Previous</small><b>'+(prev?esc(prev.title):'')+'</b></button>'+
      '<button class="donebtn'+(done.has(id)?' on':'')+'" data-done="'+id+'"><span>'+(done.has(id)?'✓ Done':'Mark as done')+'</span></button>'+
      '<button class="nbtn next" '+(next?'data-go="#/topic/'+next.id+'"':'disabled')+'><small>Next →</small><b>'+(next?esc(next.title):'')+'</b></button>'+
    '</div></div>';
  mount(html,'lesson');
  showPanel(t,0);
  window.scrollTo(0,0);
  document.title=t.title+' | Python Guide';
}
function showPanel(t,i){
  lessonTab=i;
  $$('.pill').forEach(p=>p.setAttribute('aria-selected',String(+p.dataset.pill===i)));
  $('#panel').innerHTML='<div class="panel"><div class="why">'+esc(t.why[i]||'')+'</div>'+codeBlock(t.code[i]||'')+'</div>';
}

/* interview Q&A */
function accordion(items,render){return items.map((x,i)=>render(x,i)).join('')}
function renderQA(){
  mount('<div class="pg-h"><h1>Interview Q&amp;A</h1><p>Tap a question to see a short, clear answer.</p></div><div id="list"></div>','qa');
  fillQA(false);window.scrollTo(0,0);
}
function fillQA(instant){
  const ql=query.toLowerCase();
  const items=qs.map((x,i)=>({x:x,n:i+1})).filter(o=>!ql||(o.x.q+' '+stripTags(o.x.a)).toLowerCase().indexOf(ql)>-1);
  const html=items.length?items.map((o,k)=>
    '<div class="acc rv" style="--d:'+Math.min(k*40,320)+'ms"><button class="acc-h" aria-expanded="false"><span class="qn">Q'+o.n+'</span><span class="t">'+esc(o.x.q)+'</span><span class="pm" aria-hidden="true"></span></button><div class="acc-b"><div><div class="acc-c">'+o.x.a+'</div></div></div></div>'
  ).join(''):'<div class="empty"><b>No questions found</b>Try another word.</div>';
  const list=$('#list');if(!list)return;list.innerHTML=html;reveal(list,instant);
}

/* gotchas */
function renderGotchas(){
  mount('<div class="pg-h"><h1>Gotchas</h1><p>Small Python surprises that cause bugs, and the fix for each.</p></div><div id="list"></div>','gotchas');
  fillGotchas(false);window.scrollTo(0,0);
}
function fillGotchas(instant){
  const ql=query.toLowerCase();
  const items=gotchas.filter(g=>!ql||(g.q+' '+g.code).toLowerCase().indexOf(ql)>-1);
  const html=items.length?items.map((g,k)=>
    '<div class="acc rv" style="--d:'+Math.min(k*40,320)+'ms"><button class="acc-h" aria-expanded="false"><span class="qn">!</span><span class="t">'+esc(g.q)+'</span><span class="pm" aria-hidden="true"></span></button><div class="acc-b"><div><div class="gcode">'+codeBlock(g.code,'python')+'</div></div></div></div>'
  ).join(''):'<div class="empty"><b>No gotchas found</b>Try another word.</div>';
  const list=$('#list');if(!list)return;list.innerHTML=html;reveal(list,instant);
}

/* ------------------------------------------------------------ router */
function route(){
  const h=location.hash.replace(/^#\/?/,'');
  const parts=h.split('/');
  document.title='Python Guide | Divya Ramnani';
  if(parts[0]==='topic'&&byId[parts[1]]){renderLesson(parts[1])}
  else if(parts[0]==='qa'){renderQA()}
  else if(parts[0]==='gotchas'){renderGotchas()}
  else{renderTopics()}
}
function current(){const p=location.hash.replace(/^#\/?/,'').split('/')[0];return p==='topic'?'lesson':(p==='qa'||p==='gotchas'?p:'topics')}
function go(h){if(location.hash===h){route()}else{location.hash=h}}

/* ------------------------------------------------------------ events */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-go],[data-tab],[data-chip],[data-pill],[data-copy],[data-done],[data-back],.acc-h');
  if(!el)return;
  if(el.dataset.copy!==undefined){copyText(codeStore[+el.dataset.copy],el);return}
  if(el.dataset.tab){const m={topics:'#/',qa:'#/qa',gotchas:'#/gotchas'};query='';$('#q').value='';go(m[el.dataset.tab]);return}
  if(el.dataset.chip){chip=el.dataset.chip;$$('.chip').forEach(c=>c.setAttribute('aria-pressed',String(c.dataset.chip===chip)));fillTopics(true);return}
  if(el.dataset.pill!==undefined){const t=byId[location.hash.split('/')[2]];if(t)showPanel(t,+el.dataset.pill);return}
  if(el.dataset.done){const id=el.dataset.done;if(done.has(id))done.delete(id);else done.add(id);saveDone();updateProg();el.classList.toggle('on',done.has(id));el.querySelector('span').textContent=done.has(id)?'✓ Done':'Mark as done';return}
  if(el.hasAttribute('data-back')){cameFromLesson=true;go('#/');return}
  if(el.classList.contains('acc-h')){const a=el.parentElement;const open=!a.classList.contains('open');a.classList.toggle('open',open);el.setAttribute('aria-expanded',String(open));return}
  if(el.dataset.go){
    if(current()==='topics')savedY=window.scrollY;
    if(current()==='lesson'&&el.dataset.go==='#/')cameFromLesson=true;
    go(el.dataset.go);
  }
});
$('#q').addEventListener('input',e=>{
  query=e.target.value.trim();
  const c=current();
  if(c==='lesson'){go('#/');return}
  if(c==='topics')fillTopics(true);else if(c==='qa')fillQA(true);else fillGotchas(true);
});
document.addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase();
  const typing=tag==='input'||tag==='textarea';
  if(e.key==='/'&&!typing&&current()!=='lesson'){e.preventDefault();$('#q').focus();return}
  if(e.key==='Escape'){if(typing){e.target.blur();return}if(current()==='lesson'){cameFromLesson=true;go('#/')}return}
  if(typing||current()!=='lesson'||e.metaKey||e.ctrlKey||e.altKey)return;
  const t=byId[location.hash.split('/')[2]];if(!t)return;
  if(e.key==='ArrowRight'&&all[t.i+1])go('#/topic/'+all[t.i+1].id);
  if(e.key==='ArrowLeft'&&all[t.i-1])go('#/topic/'+all[t.i-1].id);
});
window.addEventListener('hashchange',route);

updateProg();
route();
})();
</script>
